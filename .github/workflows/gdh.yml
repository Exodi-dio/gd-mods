name: Build GDH

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "gdh-v*" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: macOS
            os: macos-latest
            target: MacOS
          - name: iOS
            os: macos-latest
            target: iOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download FFmpeg libs (Android only)
        if: matrix.config.target == 'Android32' || matrix.config.target == 'Android64'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full > /dev/null
          mkdir -p .cache/ffmpeg
          curl -L --retry 3 -o .cache/ffmpeg/ffmpeg.7z \
            https://gitlab.com/tobyadd/ffmpeg-android-x264-dev/-/releases/build/downloads/ffmpeg.7z
          mkdir -p gdh/libs
          7z x .cache/ffmpeg/ffmpeg.7z -ogdh/libs -y > /dev/null
          ls gdh/libs/ffmpeg

      - name: Build GDH
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: "nightly"
          bindings: "Exodi-dio/bindings"
          bindings-ref: "main"
          path: gdh
          target: ${{ matrix.config.target }}
          build-config: Release
          combine: true

  package:
    name: Package GDH
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.build.outputs.build-output }}/*.geode
          generate_release_notes: true
