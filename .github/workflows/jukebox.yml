name: Build Jukebox

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "jukebox-v*" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [Win64, Android32, Android64]
        include:
          - target: Win64
            os: windows-latest
          - target: Android32
            os: ubuntu-latest
          - target: Android64
            os: ubuntu-latest
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Jukebox
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: "nightly"
          bindings: "Exodi-dio/bindings"
          bindings-ref: "main"
          path: jukebox
          target: ${{ matrix.target }}
          build-config: Release
          combine: true

  package:
    name: Package Jukebox
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - name: Upload merged geode
        uses: actions/upload-artifact@v4
        with:
          name: jukebox-geode
          path: ${{ steps.build.outputs.build-output }}/*.geode
