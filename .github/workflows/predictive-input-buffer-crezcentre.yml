name: Build Predictive Input Buffer (Crezcentre)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "predictive-input-buffer-crezcentre-v*" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [Android32, Android64]
        include:
          - target: Android32
            os: ubuntu-latest
          - target: Android64
            os: ubuntu-latest
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Predictive Input Buffer (Crezcentre)
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: "latest"
          bindings: "geode-sdk/bindings"
          bindings-ref: "main"
          path: predictive-input-buffer-crezcentre
          target: ${{ matrix.target }}
          build-config: Release
          combine: true

  package:
    name: Package Predictive Input Buffer (Crezcentre)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload merged geode
        uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}/*.geode