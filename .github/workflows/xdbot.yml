name: Build xdBot

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "xdbot-v*" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: macOS
            os: macos-latest
            target: MacOS
          - name: iOS
            os: macos-latest
            target: iOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build xdBot
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: "nightly"
          bindings: "Exodi-dio/bindings"
          bindings-ref: "main"
          path: xdbot
          target: ${{ matrix.config.target }}
          build-config: Release
          combine: true

  package:
    name: Package xdBot
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.build.outputs.build-output }}/*.geode
          generate_release_notes: true
